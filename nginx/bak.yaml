- server:
      port: 443
      domain:
          subject: balraug.local
      https: /var/local/step
      log: /var/log/nginx
      other:
          - 'client_max_body_size 0'
      locations:
          - type: proxy_pass
            value: https://php-server:6000
            include: /etc/nginx/includes/default.proxy.conf
      redirect: 80
- server:
      port: 443
      domain:
        subject: minio.balraug.local
      https: /var/local/step
      log: /var/log/nginx
      other:
          - 'ignore_invalid_headers off'
          - 'client_max_body_size 0'
          - 'proxy_buffering off'
          - 'proxy_request_buffering off'
      locations:
          - type: proxy_pass
            value: http://storage:9000
            include: /etc/nginx/includes/default.minio_proxy.conf
      redirect: 80
- server:
      port: 443
      domain:
        subject: mc.balraug.local
      https: /var/local/step
      log: /var/log/nginx
      locations:
          - type: proxy_pass
            value: http://storage:9001
            include: /etc/nginx/includes/default.proxy.conf
      redirect: 80
- server:
      port: 443
      domain:
          subject: phmr.balraug.local
      https: /var/local/step
      log: /var/log/nginx
      locations:
          - type: proxy_pass
            value: https://php-vite:5173
            include: /etc/nginx/includes/default.proxy.conf
      redirect: 80
- server:
      port: 443
      domain:
          subject: sock.balraug.local
      https: /var/local/step
      log: /var/log/nginx
      locations:
          - type: proxy_pass
            value: https://websockets:5000
            include: /etc/nginx/includes/default.proxy.conf
      redirect: 80
- server:
      port: 443
      domain:
          subject: balraug.com
      https:
          path: /var/local/certs
          crt: fullchain.pem
          key: privkey.pem
      log: /var/log/nginx
      other:
          - 'client_max_body_size 0'
      locations:
          - type: proxy_pass
            value: http://php-server:6000
            include: /etc/nginx/includes/default.proxy.conf
      redirect: 80
