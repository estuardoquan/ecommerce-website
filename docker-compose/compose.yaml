volumes:
    mysql:
        driver: local
    redis:
        driver: local
secrets:
    provisioner_password:
        file: $STEP_PROVISIONER_PASSWORD_FILE
services:
    crt:
        extends:
            file: $TEMPLATE_STEP_CRT
            service: crt
        volumes:
            - ./tmp:/var/local/step
    mysql:
        extends:
            file: $TEMPLATE_DB_MYSQL
            service: mysql
        volumes:
            - mysql:/var/lib/mysql
    redis:
        extends:
            file: $TEMPLATE_DB_REDIS
            service: redis
        volumes:
            - redis:/data
    phpfpm:
        extends:
            file: $TEMPLATE_PHP_PHPFPM
            service: phpfpm
        volumes:
            - ./laravel:/var/www/html
        depends_on:
            - mysql
            - redis
    vite:
        image: dqio/node:latest
        environment:
            VITECONFIG_HMR_HOST: $PHP_VITECONFIG_HMR_HOST
            VITECONFIG_HMR_CLIENTPORT: 443
            VITECONFIG_HTTPS_PATH: $_STEP 
        volumes:
            - ./tmp:$_STEP:ro
            - ./laravel:/home/node/app
        depends_on:
            - phpfpm
    ws:
        extends:
            file: $TEMPLATE_NODE_WS
            service: ws
        volumes:
            - ./tmp:$_STEP:ro
            - ./ws:/home/node/app
        depends_on:
            - redis
    fcgi:
        extends:
            file: $TEMPLATE_NGINX_SERVER
            service: server
        volumes:
            - ./tmp:$_STEP:ro
            - ./laravel:/var/www/html
            - ./nginx/fcgi.yaml:/etc/nginx/yaml/servers.yaml
        depends_on:
            - vite
            - phpfpm
    server:
        extends:
            file: $TEMPLATE_NGINX_SERVER
            service: server
        volumes:
            - ./tmp:$_STEP:ro
            - ./nginx/proxy.yaml:/etc/nginx/yaml/servers.yaml
        depends_on:
            - ws
